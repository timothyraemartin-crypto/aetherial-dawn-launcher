name: Publish launcher feed

# Fills missing sha256 pins in the server's mods.json, signs mods.json and client/manifest.json,
# and verifies them: the one step that must run after every change to those files, and before
# players get a launcher that expects signatures. Manual only; does nothing without AD_SSH_* secrets.

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Only report (no changes, no signing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: live-server
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: have
        run: |
          if [ -n "${{ secrets.AD_SSH_KEY }}" ] && [ -n "${{ secrets.AD_SSH_HOST }}" ] && [ -n "${{ secrets.AD_SSH_USER }}" ] && [ -n "${{ secrets.AD_SSH_KNOWN_HOSTS }}" ]; then
            echo ready=true >> "$GITHUB_OUTPUT"
          else
            echo ready=false >> "$GITHUB_OUTPUT"
            echo 'Skipped: add AD_SSH_HOST, AD_SSH_USER, AD_SSH_KEY and AD_SSH_KNOWN_HOSTS (see docs/signing-feeds.md).' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run scripts/publish-feed.sh on the server
        if: steps.have.outputs.ready == 'true'
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.AD_SSH_KEY }}" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.AD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          flag=""; [ "${{ inputs.check_only }}" = true ] && flag="--check"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.AD_SSH_USER }}@${{ secrets.AD_SSH_HOST }}" \
            "sudo env AD_WEB_ROOT='${{ vars.AD_WEB_ROOT }}' AD_FEED_KEY='${{ vars.AD_FEED_KEY }}' bash -s -- $flag" < scripts/publish-feed.sh
