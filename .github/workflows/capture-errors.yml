name: Capture errors

# When a workflow fails on main (or on a manual/scheduled run), open one `auto-error` issue for it, or
# update the open one. A fix task picks up `auto-error` issues. Pull request runs are left to their PR.
on:
  workflow_run:
    workflows: ['*']
    types: [completed]

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: capture-errors
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'Capture errors' &&
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.event != 'push')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WF: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVT: ${{ github.event.workflow_run.event }}
        run: |
          set -uo pipefail
          { echo "Workflow **$WF** failed ($EVT) at \`${SHA:0:7}\`: $RUN_URL"; echo; echo 'Failed step output (last lines):'; echo '```';
            gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -n 60 | cut -c1-300 | sed -E 's/^[^\t]*\t[^\t]*\t[0-9TZ:.-]+ //' ;
            echo '```'; } > body.md
          KEY="workflow:$WF" TITLE="[auto-error] $WF is failing" BODY_FILE=body.md node .github/auto-issue.cjs
