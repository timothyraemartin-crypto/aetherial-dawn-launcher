name: Build launcher

# Builds the Windows installer on every push. Every push to main also publishes
# it as the GitHub release for the version in Cargo.toml (v0.1.5 and so on),
# so players get a normal download link. Bump the version to make a new release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Where the server publishes launcher files, and the Discord login service.
      # Override with repository variables if the server moves.
      AD_BASE_URL: ${{ vars.AD_BASE_URL || 'https://vps-d38c928e.vps.ovh.us/launcher' }}
      AD_AUTH_URL: ${{ vars.AD_AUTH_URL || 'https://vps-d38c928e.vps.ovh.us/ad' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p launcher-core
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.0
      - name: Build installer
        shell: bash
        env:
          # Private key for signed launcher updates, given to this step only so
          # the install test and the launcher it starts can't read it. Without
          # it the build still works but produces no update signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning title=Unsigned build::The TAURI_SIGNING_PRIVATE_KEY repository secret is empty, so this installer has no update signature and no latest.json. Add it under Settings, Secrets and variables, Actions, Repository secrets."
            cargo tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            cargo tauri build --bundles nsis
          fi
      - name: Name the installer
        shell: bash
        run: |
          mkdir dist
          for f in target/release/bundle/nsis/*.exe; do
            v=$(basename "$f" | sed -E 's/.*_([0-9][^_]*)_x64-setup\.exe/\1/')
            out="AetherialDawn-Launcher-$v-setup.exe"
            cp "$f" "dist/$out"
            echo "VERSION=$v" >> "$GITHUB_ENV"
            # Signed builds also get the self-update feed, latest.json. The launcher
            # reads it from this repo's latest release (the repo is public for this),
            # or from <server>/launcher/app/latest.json if it's copied there.
            if [ -f "$f.sig" ]; then
              cp "$f.sig" "dist/$out.sig"
              sig=$(cat "$f.sig")
              printf '{\n  "version": "%s",\n  "notes": "Aetherial Dawn launcher %s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "%s/%s"\n    }\n  }\n}\n' \
                "$v" "$v" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$sig" "https://github.com/$GITHUB_REPOSITORY/releases/download/v$v" "$out" > dist/latest.json
            fi
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: aetherial-dawn-launcher-windows
          path: dist/*
      # Runs the installer the way a new player does (no flags) and checks the
      # whole one-click install, then the update and silent runs. A failure
      # here stops the release.
      - name: Install like a new player
        shell: pwsh
        run: ./.github/scripts/one-click-test.ps1 -Setup "dist/AetherialDawn-Launcher-$env:VERSION-setup.exe" -Version $env:VERSION
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Aetherial Dawn Launcher ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            Windows installer for the Aetherial Dawn launcher.
            Download **AetherialDawn-Launcher-…-setup.exe** below and run it. It installs with no pages to click through and opens the launcher when it's done. Windows may warn that the app is unrecognised because it isn't code-signed yet; choose **More info → Run anyway**.
            Running the installer again by hand closes a running launcher and quietly reinstalls; your settings and downloads are kept.

  # The canonical-plugins tool for the server (staging runbook C): the VPS has
  # no Rust, so it downloads this build from the release instead. Static
  # (musl), so it runs on any Linux x86_64. It runs after the Windows job so
  # both add to the one release.
  canonical-plugins-linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          cargo build --locked --release -p launcher-core --bin canonical-plugins --target x86_64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/canonical-plugins dist/canonical-plugins-linux-x86_64
          (cd dist && sha256sum canonical-plugins-linux-x86_64 | tee canonical-plugins-linux-x86_64.sha256)
          echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-plugins-linux-x86_64
          path: dist/*
      - name: Add to the release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/*

  # Proves the upgrade players take: installs the live launcher release, saves a
  # player's settings and sign-in, then runs a built installer the way the
  # launcher's updater does and checks the result.
  upgrade:
    # Only on this test branch, run by hand. The live release players have
    # now, and the Build launcher run whose installer is the new version.
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'upgrade-test'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      OLD_TAG: v0.1.87
      BUILD_RUN: "36363727323"
    steps:
      - uses: actions/checkout@v4
      - name: Get the live release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ env.OLD_TAG }}" --repo "$GITHUB_REPOSITORY" --pattern '*-setup.exe' --dir old
          ls -la old
          echo "OLD_VERSION=${{ env.OLD_TAG }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: Get the new installer
        uses: actions/download-artifact@v4
        with:
          name: aetherial-dawn-launcher-windows
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: new
      - name: Name the new build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ env.BUILD_RUN }}" --jq '"build run \(.id): \(.head_branch) \(.head_sha) \(.conclusion)"'
          ls -la new
          f=$(ls new/*-setup.exe)
          echo "NEW_VERSION=$(basename "$f" | sed -E 's/AetherialDawn-Launcher-(.*)-setup\.exe/\1/')" >> "$GITHUB_ENV"
      # The saved sign-in is a test token, so the login service must not be
      # reached (it would sign the test player out). With the service
      # unreachable the launcher keeps a sign-in for a day, as it does for a
      # player whose internet drops.
      - name: Keep the login service out of reach
        shell: pwsh
        run: Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`n127.0.0.1 vps-d38c928e.vps.ovh.us"
      - name: Upgrade like a player
        shell: pwsh
        run: ./.github/scripts/upgrade-test.ps1 -OldSetup (Get-ChildItem old/*-setup.exe).FullName -OldVersion $env:OLD_VERSION -NewSetup (Get-ChildItem new/*-setup.exe).FullName -NewVersion $env:NEW_VERSION
