name: Build launcher

# Builds the Windows installer on every push. Every push to main also publishes
# it as the GitHub release for the version in Cargo.toml (v0.1.5 and so on),
# so players get a normal download link. Bump the version to make a new release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Where the server publishes launcher files, and the Discord login service.
      # Override with repository variables if the server moves.
      AD_BASE_URL: ${{ vars.AD_BASE_URL || 'https://vps-d38c928e.vps.ovh.us/launcher' }}
      AD_AUTH_URL: ${{ vars.AD_AUTH_URL || 'https://vps-d38c928e.vps.ovh.us/ad' }}
      # Private key for signed launcher updates. Without it the build still
      # works but produces no update signature.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p launcher-core
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Build installer
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning title=Unsigned build::The TAURI_SIGNING_PRIVATE_KEY repository secret is empty, so this installer has no update signature and no latest.json. Add it under Settings, Secrets and variables, Actions, Repository secrets."
            cargo tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            cargo tauri build --bundles nsis
          fi
      - name: Name the installer
        shell: bash
        run: |
          mkdir dist
          for f in target/release/bundle/nsis/*.exe; do
            v=$(basename "$f" | sed -E 's/.*_([0-9][^_]*)_x64-setup\.exe/\1/')
            out="AetherialDawn-Launcher-$v-setup.exe"
            cp "$f" "dist/$out"
            echo "VERSION=$v" >> "$GITHUB_ENV"
            # Signed builds also get the self-update feed, latest.json. The launcher
            # reads it from this repo's latest release (the repo is public for this),
            # or from <server>/launcher/app/latest.json if it's copied there.
            if [ -f "$f.sig" ]; then
              cp "$f.sig" "dist/$out.sig"
              sig=$(cat "$f.sig")
              printf '{\n  "version": "%s",\n  "notes": "Aetherial Dawn launcher %s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "%s/%s"\n    }\n  }\n}\n' \
                "$v" "$v" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$sig" "https://github.com/$GITHUB_REPOSITORY/releases/download/v$v" "$out" > dist/latest.json
            fi
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: aetherial-dawn-launcher-windows
          path: dist/*
      # Throwaway branch only: a fresh Windows profile installs and opens the
      # launcher, and the screen and launcher.log are kept for review.
      - name: First-run smoke
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*.exe | Select-Object -First 1
          $t = Measure-Command { Start-Process $setup.FullName -ArgumentList '/S' -Wait }
          "installer ran silently in $([int]$t.TotalSeconds) s"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Aetherial Dawn","$env:LOCALAPPDATA\Programs" -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          "launcher: $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          New-Item -ItemType Directory smoke | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          foreach ($s in 8, 25, 60) {
            Start-Sleep -Seconds ($s - ($(if ($s -eq 8) {0} elseif ($s -eq 25) {8} else {25})))
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke/screen-$s.png")
          }
          "still running: $(-not $p.HasExited)"
          Get-ChildItem "$env:LOCALAPPDATA\gg.aetherialdawn.launcher" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          $log = "$env:LOCALAPPDATA\gg.aetherialdawn.launcher\logs\launcher.log"
          if (Test-Path $log) { Copy-Item $log smoke/; Get-Content $log }
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: first-run-smoke
          path: smoke/*
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Aetherial Dawn Launcher ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            Windows installer for the Aetherial Dawn launcher.
            Download **AetherialDawn-Launcher-…-setup.exe** below and run it. Windows may warn that the app is unrecognised because it isn't code-signed yet; choose **More info → Run anyway**.

  # The canonical-plugins tool for the server (staging runbook C): the VPS has
  # no Rust, so it downloads this build from the release instead. Static
  # (musl), so it runs on any Linux x86_64. It runs after the Windows job so
  # both add to the one release.
  canonical-plugins-linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          cargo build --locked --release -p launcher-core --bin canonical-plugins --target x86_64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/canonical-plugins dist/canonical-plugins-linux-x86_64
          (cd dist && sha256sum canonical-plugins-linux-x86_64 | tee canonical-plugins-linux-x86_64.sha256)
          echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-plugins-linux-x86_64
          path: dist/*
      - name: Add to the release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/*
