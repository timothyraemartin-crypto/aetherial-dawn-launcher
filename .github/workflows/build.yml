name: Build launcher

# Builds the Windows installer on every push. Every push to main also publishes
# it as the GitHub release for the version in Cargo.toml (v0.1.5 and so on),
# so players get a normal download link. Bump the version to make a new release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Where the server publishes launcher files, and the Discord login service.
      # Override with repository variables if the server moves.
      AD_BASE_URL: ${{ vars.AD_BASE_URL || 'https://vps-d38c928e.vps.ovh.us/launcher' }}
      AD_AUTH_URL: ${{ vars.AD_AUTH_URL || 'https://vps-d38c928e.vps.ovh.us/ad' }}
      # Private key for signed launcher updates. Without it the build still
      # works but produces no update signature.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p launcher-core
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Build installer
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            cargo tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            cargo tauri build --bundles nsis
          fi
      - name: Name the installer
        shell: bash
        run: |
          mkdir dist
          for f in target/release/bundle/nsis/*.exe; do
            v=$(basename "$f" | sed -E 's/.*_([0-9][^_]*)_x64-setup\.exe/\1/')
            out="AetherialDawn-Launcher-$v-setup.exe"
            cp "$f" "dist/$out"
            echo "VERSION=$v" >> "$GITHUB_ENV"
            # Signed builds also get the self-update feed. Copy latest.json and the
            # installer to <server>/launcher/app/ on the VPS to roll the update out.
            if [ -f "$f.sig" ]; then
              cp "$f.sig" "dist/$out.sig"
              sig=$(cat "$f.sig")
              printf '{\n  "version": "%s",\n  "notes": "Aetherial Dawn launcher %s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "%s/app/%s"\n    }\n  }\n}\n' \
                "$v" "$v" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$sig" "$AD_BASE_URL" "$out" > dist/latest.json
            fi
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: aetherial-dawn-launcher-windows
          path: dist/*
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Aetherial Dawn Launcher ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            Windows installer for the Aetherial Dawn launcher.
            Download **AetherialDawn-Launcher-…-setup.exe** below and run it. Windows may warn that the app is unrecognised because it isn't code-signed yet; choose **More info → Run anyway**.
