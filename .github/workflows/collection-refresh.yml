name: Refresh Nexus collection list
# Rebuilds the `collection` object of server/launcher-rules.json for a Nexus revision, using the
# NEXUS_API_KEY secret to read the collection's own collection.json (real plugin order).
# It publishes nothing: download the artifact, review it, then use Publish launcher feed (rules mode).
on:
  # Also runs on pull requests that touch it, so it can be tried before it is on main (dispatch needs the file on main).
  pull_request:
    paths: ['.github/workflows/collection-refresh.yml', 'scripts/collection-rules.sh']
  workflow_dispatch:
    inputs:
      revision:
        description: Nexus collection revision number (empty = current + 1)
        required: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the revision (read-only)
        continue-on-error: true
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          REVISION: ${{ inputs.revision || '6' }}
        run: |
          set +x
          sudo apt-get install -y p7zip-full >/dev/null
          scripts/collection-inspect.sh "$REVISION" 2>&1 | tee inspect.txt
      - name: Rebuild the collection list
        continue-on-error: true
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          REVISION: ${{ inputs.revision || (github.event_name == 'pull_request' && '6' || '') }}
        run: |
          set +x
          sudo apt-get install -y p7zip-full >/dev/null
          scripts/collection-rules.sh $REVISION
          git diff --stat
          jq -c '.collection | {revision, pluginOrder, mods: [.mods[].name]}' server/launcher-rules.json
      - uses: actions/upload-artifact@v4
        with:
          name: collection-rules
          path: |
            inspect.txt
            server/launcher-rules.json
            core/data/collection-*.json
