name: Server scripts

on:
  pull_request:
    paths: ["scripts/**", ".github/workflows/scripts.yml"]
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: read

jobs:
  publish-feed:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/publish-feed.sh
      - run: scripts/test-publish-feed.sh
