name: Server scripts

on:
  pull_request:
    paths: ["scripts/**", ".github/workflows/scripts.yml"]
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: read

jobs:
  publish-feed:
    # Fork PRs never reach the self-hosted runner.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/publish-feed.sh
      - run: scripts/test-publish-feed.sh
