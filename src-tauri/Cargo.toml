[package]
name = "aetherial-dawn-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# gzip: only the face client asks for it (main.rs sets no_gzip on the rest).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }
tauri-plugin-single-instance = "2"
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "sync"] }
http = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Media_Audio_XAudio2", "Win32_System_Com"] }
