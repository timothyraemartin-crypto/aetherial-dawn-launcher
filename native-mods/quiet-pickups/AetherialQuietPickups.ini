; AetherialQuietPickups - hides vanilla "X added/removed" notices (top-left)
Enabled=1
; Set to 1 to log every HUD notification and whether it was hidden to
; Documents\My Games\Skyrim Special Edition\SKSE\AetherialQuietPickups.log
LogNotifications=1
; ';'-separated, case-insensitive substrings; a notice containing any is hidden
HideContains= added; removed
