[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
rand = "0.9"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
sevenz-rust2 = { version = "0.23", default-features = false }
zstd = "0.13"
lz4_flex = "0.11"
futures-util = { version = "0.3", features = ["sink"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
