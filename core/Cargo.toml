[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rar"]
rar = ["dep:unrar"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
rand = "0.9"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
sevenz-rust2 = { version = "0.23", default-features = false }
# RAR downloads, through rarlab's unrar library (C++). Off for the static
# musl canonical-plugins tool, which never unpacks archives.
unrar = { version = "0.5.8", optional = true }
zstd = "0.13"
# LZMA entries in zips (FSMP 4.0.1): the zip crate's own LZMA reader fails
# on them; this is the decoder sevenz-rust2 already brings.
lzma-rust2 = { version = "0.21", default-features = false, features = ["std"] }
roxmltree = "0.20"
lz4_flex = "0.11"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
